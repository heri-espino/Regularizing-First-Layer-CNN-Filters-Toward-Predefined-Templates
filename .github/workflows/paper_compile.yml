name: paper-compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install figure dependencies
        run: python -m pip install -e ".[experiments]"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - name: Export lightweight frozen gallery inputs
        run: python paper/prepare_kernel_gallery.py
      - name: Check archive unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile manuscript
        run: python paper/build.py --clean
      - name: Compile supplement
        run: python paper/build_supplement.py --clean
      - name: Build and independently verify submission archives
        run: python paper/build_submission_package.py --verify
      - name: Upload compiled submission package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sn-computer-science-submission-${{ github.sha }}
          path: |
            paper/dist/manuscript.pdf
            paper/dist/supplementary_information.pdf
            paper/dist/manuscript_sources.zip
            paper/dist/activation_patching_reproducibility.zip
            paper/build/main.log
            paper/supplement_build/sn_supplement.log
          retention-days: 30
          if-no-files-found: warn
