name: paper-figures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-figures-manual
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-lmodern texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          fc-match 'Latin Modern Roman' | head -1
      - name: Normalize publication labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('paper/build_figures.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('return task.replace("_", r"\\_")', 'return task.replace("_", " ")')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate publication figures
        run: python paper/build_figures.py
      - name: Point manuscript at publication figures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('paper/main.tex')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'\pandocbounded{\includegraphics[width=\linewidth]{../analysis/retention_release_001/learning.png}}':
                  r'\includegraphics[width=\linewidth]{figures/fig01_learning.pdf}',
              r'\includegraphics[width=\linewidth]{../analysis/exhaustive_robustness_001/selected_fidelity_budget_curves.png}':
                  r'\includegraphics[width=\linewidth]{figures/fig02_patch_size.pdf}',
              r'\includegraphics[width=\linewidth]{../analysis/kernel_similarity/results/matching_trajectories.png}':
                  r'\includegraphics[width=\linewidth]{figures/fig03_matching_trajectories.pdf}',
              r'\includegraphics[width=\linewidth]{../analysis/kernel_similarity/results/matrices_two_concepts_TinyCNN.png}':
                  r'\includegraphics[width=\linewidth]{figures/fig04_similarity_matrices.pdf}',
              r'\includegraphics[width=\linewidth]{../analysis/kernel_similarity/results/kernels_two_concepts_TinyCNN.png}':
                  r'\includegraphics[width=\linewidth]{figures/fig05_kernel_gallery.pdf}',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          raster_note = 'The dense kernel cells are rasterized inside the PDF while labels remain vector. '
          while raster_note + raster_note in text:
              text = text.replace(raster_note + raster_note, raster_note)
          if raster_note not in text:
              text = text.replace(
                  'The illustration concerns kernel-template similarity, not human interpretability.}',
                  raster_note + 'The illustration concerns kernel-template similarity, not human interpretability.}',
              )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Check generated files
        run: |
          test -s paper/figures/fig01_learning.pdf
          test -s paper/figures/fig02_patch_size.pdf
          test -s paper/figures/fig03_matching_trajectories.pdf
          test -s paper/figures/fig04_similarity_matrices.pdf
          test -s paper/figures/fig05_kernel_gallery.pdf
          git diff --check
      - name: Compile manuscript with refreshed figures
        run: python paper/build.py --clean
      - name: Upload visual-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmlr-publication-figures-${{ github.sha }}
          path: |
            paper/tmlr_submission.pdf
            paper/figures/*.pdf
            paper/build/main.log
          retention-days: 30
          if-no-files-found: error
